name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          CODE=$((major * 10000 + minor * 100 + patch))
          sed -i "s/^version: .*/version: $VERSION+$CODE/" pubspec.yaml
          echo "Building version $VERSION ($CODE)"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed AAB (Play Store, no SMS) and APK (full, with SMS)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_FILE: ${{ github.workspace }}/release.keystore
        run: bundle exec fastlane android build

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-play-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          retention-days: 30

      - name: Upload full APK (with SMS)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-full-apk
          path: build/app/outputs/flutter-apk/app-full-release.apk
          retention-days: 30
